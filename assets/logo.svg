<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Dark Cyberpunk Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#120024"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </linearGradient>

    <!-- Neon Color Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>

    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FF0055"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#260048" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="250" fill="url(#bg-grad)" rx="14"/>
  <rect width="800" height="250" fill="url(#grid)" rx="14" opacity="0.6"/>

  <!-- Cyberpunk Cut Corner Frames -->
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#00F5FF" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 745 25 L 775 25 L 775 55" fill="none" stroke="#FF007F" stroke-width="3" filter="url(#glow-pink)"/>
  <path d="M 775 195 L 775 225 L 745 225" fill="none" stroke="#00F5FF" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 55 225 L 25 225 L 25 195" fill="none" stroke="#FF007F" stroke-width="3" filter="url(#glow-pink)"/>

  <!-- Subtle Accent Lines -->
  <line x1="65" y1="25" x2="735" y2="25" stroke="#FF007F" stroke-width="1" opacity="0.3"/>
  <line x1="65" y1="225" x2="735" y2="225" stroke="#00F5FF" stroke-width="1" opacity="0.3"/>

  <!-- Lightning Icon -->
  <g transform="translate(60, 68) scale(1.4)">
    <polygon points="25,0 5,38 22,38 14,65 42,22 23,22" fill="#FFE600" filter="url(#glow-cyan)"/>
  </g>

  <!-- Main Logo Typography -->
  <text x="135" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#00F5FF" letter-spacing="4" filter="url(#glow-cyan)">HA<tspan fill="#FFFFFF">PROXY</tspan></text>
  <text x="500" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FF007F" letter-spacing="4" filter="url(#glow-pink)">TUI</text>

  <!-- Horizontal Divider Line -->
  <rect x="135" y="148" width="530" height="2" fill="url(#neon-cyan)"/>

  <!-- Subtitle Text -->
  <text x="135" y="176" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#FFE600" letter-spacing="5">SYS_TOPOLOGY // REMOTE MONITORING INTERFACE</text>

  <!-- Status Badges Preview inside Banner -->
  <rect x="135" y="192" width="50" height="18" rx="3" fill="#00FF66" opacity="0.15"/>
  <text x="148" y="205" font-family="monospace" font-size="11" font-weight="bold" fill="#00FF66">UP</text>

  <rect x="195" y="192" width="60" height="18" rx="3" fill="#FF0055" opacity="0.15"/>
  <text x="204" y="205" font-family="monospace" font-size="11" font-weight="bold" fill="#FF0055">DOWN</text>

  <rect x="265" y="192" width="65" height="18" rx="3" fill="#FF9900" opacity="0.15"/>
  <text x="274" y="205" font-family="monospace" font-size="11" font-weight="bold" fill="#FF9900">MAINT</text>

  <!-- Version / Protocol Stamp -->
  <text x="735" y="206" font-family="monospace" font-size="11" fill="#666666" text-anchor="end">v1.0 // SSH_SOCAT</text>
</svg>
