name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Multi-Platform Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Generate Dynamic Tag
        id: tag
        run: |
          echo "TAG_NAME=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Cross-compile Binaries
        run: |
          mkdir -p dist

          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -o dist/haproxyTUI-linux-amd64 .

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -o dist/haproxyTUI-linux-arm64 .

          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -o dist/haproxyTUI-darwin-arm64 .

          # macOS AMD64 (Intel)
          GOOS=darwin GOARCH=amd64 go build -o dist/haproxyTUI-darwin-amd64 .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
